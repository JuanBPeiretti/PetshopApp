spring.application.name=app

# Petshop app properties
# Interval for ResetTokenCleaner in milliseconds (default 300000 = 5 minutes)

# Petshop app
petshop.reset.cleaner.rate=300000

# SQL Server
# Base de datos local cada uno debe ajustarla a la suya
spring.datasource.url=jdbc:sqlserver://localhost:1434;databaseName=petshop;encrypt=true;trustServerCertificate=true
spring.datasource.username=admin
spring.datasource.password=admin
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
